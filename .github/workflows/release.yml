name: Publish tagged extension release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const pkg = require("./package.json");
            const manifest = require("./public/manifest.json");
            const tag = process.env.RELEASE_TAG;
            if (tag !== "v" + pkg.version || pkg.version !== manifest.version) {
              console.error("Tag, package.json, and extension manifest versions must match.");
              process.exit(1);
            }
          '
      - name: Typecheck
        run: npm run typecheck
      - name: Build once
        run: npm run build
      - name: Verify extension bundle
        run: |
          test -s dist/manifest.json
          test -s dist/background.js
          test -s dist/content.js
      - name: Create distributable archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          (cd dist && zip -q -r "../release/ytwash-${RELEASE_TAG}.zip" .)
          (cd release && sha256sum "ytwash-${RELEASE_TAG}.zip" > "ytwash-${RELEASE_TAG}.sha256")
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: |
            release/ytwash-*.zip
            release/ytwash-*.sha256
