name: Publish tagged extension release

on:
  push:
    tags:
      - 'v[0-9]*'
    branches:
      - 'release/[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Resolve version tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
          fi
      - name: Validate version matches tag
        run: |
          node -e '
            const pkg = require("./package.json");
            const manifest = require("./public/manifest.json");
            const tag = process.env.RELEASE_TAG;
            if (!new RegExp("^v" + pkg.version.replaceAll(".", "\\.") + "(?:-(?:alpha|beta)\\.[0-9]+)?$").test(tag) || pkg.version !== manifest.version) {
              console.error("Tag, package.json, and extension manifest versions must match.");
              process.exit(1);
            }
          '
      - name: Typecheck
        run: npm run typecheck
      - name: Build once
        run: npm run build
      - name: Verify extension bundle
        run: |
          test -s dist/manifest.json
          test -s dist/background.js
          test -s dist/content.js
          test -s dist-firefox/manifest.json
      - name: Create distributable archive and checksum
        run: |
          mkdir -p release
          (cd dist && zip -q -r "../release/ytwash-${RELEASE_TAG}.zip" .)
          (cd dist-firefox && zip -q -r "../release/ytwash-${RELEASE_TAG}-firefox.zip" .)
          (cd release && sha256sum "ytwash-${RELEASE_TAG}-firefox.zip" > "ytwash-${RELEASE_TAG}-firefox.sha256")
          zip -q -r "release/ytwash-${RELEASE_TAG}-publishing-assets.zip" assets/brand public/icons site/icons site/favicon.ico
          (cd release && sha256sum "ytwash-${RELEASE_TAG}-publishing-assets.zip" > "ytwash-${RELEASE_TAG}-publishing-assets.sha256")
          (cd release && sha256sum "ytwash-${RELEASE_TAG}.zip" > "ytwash-${RELEASE_TAG}.sha256")
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          prerelease: true
          files: |
            release/ytwash-*.zip
            release/ytwash-*.sha256
