name: Build once and test browsers
on: [push, pull_request]
concurrency:
  group: browser-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cross-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install dependencies once
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Typecheck once
        run: npm run typecheck
      - name: Build extension once
        run: npm run build
      - name: Cache Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - uses: browser-actions/setup-geckodriver@latest
      - name: Cache shared WebM fixture
        id: webm-cache
        uses: actions/cache@v4
        with:
          path: tests/fixtures/mock-video.webm
          key: ytwash-webm-v1-32x32-120s
      - name: Generate shared WebM only on cache miss
        if: steps.webm-cache.outputs.cache-hit != 'true'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p tests/fixtures
          ffmpeg -loglevel error -f lavfi -i color=c=black:s=32x32:r=2 -t 120 -an -c:v libvpx -b:v 100k -g 1 -deadline realtime -cpu-used 8 -y tests/fixtures/mock-video.webm
      - name: Verify shared WebM fixture
        run: test -s tests/fixtures/mock-video.webm
      - name: Test same dist in Chromium
        id: chromium
        run: npm run test:e2e
      - name: Test same dist in Firefox
        if: success() || failure()
        run: npm run test:firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ytwash-browser-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ytwash-extension
          path: dist/
