name: Build and test extension
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate deterministic playable media fixture
        run: |
          mkdir -p tests/fixtures
          ffmpeg -loglevel error -f lavfi -i color=c=black:s=32x32:r=2 -t 120 -an -c:v libvpx -b:v 100k -g 1 -deadline realtime -cpu-used 8 -y tests/fixtures/mock-video.webm
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ytwash-playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ytwash-extension
          path: dist/
