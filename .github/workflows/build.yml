name: Build once and test browsers
on:
  push:
    branches:
      - 'feature/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build extension
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ytwash-extension
          path: |
            dist/
            dist-firefox/
          if-no-files-found: error

  browsers:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    name: Test ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: ytwash-extension
          path: .
      - name: Install Chromium
        if: matrix.browser == 'chromium'
        run: npx playwright install --with-deps chromium
      - uses: browser-actions/setup-firefox@v1
        if: matrix.browser == 'firefox'
        with:
          firefox-version: latest
      - uses: browser-actions/setup-geckodriver@latest
        if: matrix.browser == 'firefox'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate video fixture
        run: |
          mkdir -p tests/fixtures
          ffmpeg -loglevel error -f lavfi -i color=c=black:s=32x32:r=2 -t 120 -an -c:v libvpx -b:v 100k -g 1 -deadline realtime -cpu-used 8 -y tests/fixtures/mock-video.webm
      - name: Test browser
        run: npm run test:${{ matrix.browser == 'chromium' && 'e2e' || 'firefox' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ytwash-${{ matrix.browser }}-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
