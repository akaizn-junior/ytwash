<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YTWash options</title>
  <style>
    :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
    body { max-width: 640px; margin: 48px auto; padding: 0 24px; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p { line-height: 1.6; color: light-dark(#555, #bbb); }
    fieldset { border: 0; padding: 0; margin: 32px 0; }
    legend { font-size: 19px; font-weight: 600; margin-bottom: 16px; }
    label { display: grid; grid-template-columns: 20px 1fr; gap: 12px; margin: 20px 0; cursor: pointer; }
    input { margin-top: 4px; accent-color: #7652df; }
    small { display: block; font-size: 14px; line-height: 1.5; margin-top: 5px; color: light-dark(#555, #bbb); }
    #status { min-height: 24px; }
  </style>
</head>
<body>
  <h1><img src="icons/icon-48.png" alt="" width="48" height="48" style="vertical-align:middle;background:#ff0033;border-radius:10px;margin-right:12px">YTWash</h1>
  <p>Your preferences stay in this browser. Changes apply to open YouTube tabs.</p>
  <fieldset disabled id="preferences">
    <legend>Playlist preferences</legend>
    <label><input type="checkbox" data-key="ytwash:group-by-creator" data-default="false"><span>Group playlists by creator<small>Applies to Watch Later and other YouTube playlists. Group loaded videos by creator automatically. Turn off to restore YouTube’s original order.</small></span></label>
    <label><input type="checkbox" data-key="ytwash:auto-remove-completed" data-default="false"><span>Remove completed videos from Watch Later<small>Off by default. After a video finishes naturally, remove it only if Watch Later membership can be confirmed. This does not close the video tab.</small></span></label>
  </fieldset>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="options.js"></script>
</body>
</html>
